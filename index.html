<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black FFT & Strings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000000;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const MIN_FREQ = 80;
    const MAX_FREQ = 4000;
    const LIFETIME_SEC = 10.0;

    let audioCtx = null;
    let analyser = null;
    let freqData = null;

    let anchorNode = null; // 現在の始点となる丸印 { x, y, age, lifetime }
    const clickMarkers = []; // クリックした丸印のリスト { x, y, age, lifetime, pulseAge }
    const strings = [];

    let fftAlpha = 0;
    let hasPluckedInitialString = false;
    let lastTime = performance.now();

    function getLogicalSize() {
      const w = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 800);
      const h = Math.max(240, window.innerHeight || document.documentElement.clientHeight || 600);
      return { width: w, height: h };
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const { width, height } = getLogicalSize();
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resize();

    // 周波数 -> X座標（対数スケール）
    function freqToX(freq, width) {
      const clamped = Math.max(MIN_FREQ, Math.min(MAX_FREQ, freq));
      const logMin = Math.log10(MIN_FREQ);
      const logMax = Math.log10(MAX_FREQ);
      return ((Math.log10(clamped) - logMin) / (logMax - logMin)) * width;
    }

    // X座標 -> 周波数（対数スケール）
    function xToFreq(x, width) {
      const ratio = Math.max(0, Math.min(1, x / Math.max(1, width)));
      const logMin = Math.log10(MIN_FREQ);
      const logMax = Math.log10(MAX_FREQ);
      return Math.pow(10, logMin + ratio * (logMax - logMin));
    }

    // 水平・垂直の度合い（0 = 完全水平: 正弦波, 1 = 完全垂直: 矩形波）
    function computeVerticalRatio(p1, p2) {
      const dx = Math.abs(p2.x - p1.x);
      const dy = Math.abs(p2.y - p1.y);
      const len = Math.hypot(dx, dy);
      if (len < 1) return 0;
      const angle = Math.atan2(dy, dx);
      return Math.min(1, Math.max(0, angle / (Math.PI / 2)));
    }

    // 弦の周波数計算
    function computeStringFreq(p1, p2, width) {
      const midX = (p1.x + p2.x) / 2;
      const len = Math.max(24, Math.hypot(p2.x - p1.x, p2.y - p1.y));
      const baseFreq = xToFreq(midX, width);
      const lengthFactor = 180 / len;
      return Math.max(MIN_FREQ, Math.min(MAX_FREQ, baseFreq * Math.pow(lengthFactor, 0.2)));
    }

    function ensureAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.8;
        freqData = new Uint8Array(analyser.frequencyBinCount);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    // 正弦波（水平）と矩形波（垂直）をブレンドして発音
    function playBlendedTone(freq, verticalRatio) {
      ensureAudio();
      const now = audioCtx.currentTime;

      const sineOsc = audioCtx.createOscillator();
      sineOsc.type = "sine";
      sineOsc.frequency.setValueAtTime(freq, now);

      const squareOsc = audioCtx.createOscillator();
      squareOsc.type = "square";
      squareOsc.frequency.setValueAtTime(freq, now);

      const sineGain = audioCtx.createGain();
      const squareGain = audioCtx.createGain();
      const masterGain = audioCtx.createGain();

      const sineWeight = 1 - verticalRatio;
      const squareWeight = verticalRatio * 0.55;

      sineGain.gain.setValueAtTime(sineWeight, now);
      squareGain.gain.setValueAtTime(squareWeight, now);

      masterGain.gain.setValueAtTime(0.0001, now);
      masterGain.gain.exponentialRampToValueAtTime(0.28, now + 0.012);
      masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

      sineOsc.connect(sineGain);
      squareOsc.connect(squareGain);
      sineGain.connect(masterGain);
      squareGain.connect(masterGain);

      masterGain.connect(analyser);
      analyser.connect(audioCtx.destination);

      sineOsc.start(now);
      squareOsc.start(now);
      sineOsc.stop(now + 1.22);
      squareOsc.stop(now + 1.22);

      fftAlpha = 1.0;
    }

    // 丸い印（⚪︎）を追加
    function addCircleMarker(x, y) {
      const marker = {
        x,
        y,
        age: 0,
        lifetime: LIFETIME_SEC,
        pulseAge: 0,
      };
      clickMarkers.push(marker);
      return marker;
    }

    // 初期表示用に1本（440Hzの水平弦）を両端の⚪︎とともに張る
    function setupInitialString() {
      const { width, height } = getLogicalSize();
      const targetX = freqToX(440, width);
      const halfSpan = Math.min(150, Math.max(70, width * 0.16));
      const cx = Math.max(halfSpan + 24, Math.min(width - halfSpan - 24, targetX));
      const y = height * 0.42;

      const n1 = addCircleMarker(cx - halfSpan, y);
      const n2 = addCircleMarker(cx + halfSpan, y);

      strings.push({
        n1,
        n2,
        centerX: cx,
        centerY: y,
        freq: 440,
        hzText: "440",
        verticalRatio: 0,
        age: 0,
        lifetime: LIFETIME_SEC,
        pluckStrength: 10,
        vibPhase: 0,
        isInitial: true,
      });
    }

    setupInitialString();

    window.addEventListener("resize", () => {
      resize();
      if (!hasPluckedInitialString && strings.length === 1 && strings[0].isInitial) {
        strings.length = 0;
        clickMarkers.length = 0;
        anchorNode = null;
        setupInitialString();
      }
    });

    // ⚪︎と⚪︎のあいだに弦を生成・はじく
    function createAndPluckString(n1, n2, width) {
      const freq = computeStringFreq(n1, n2, width);
      const verticalRatio = computeVerticalRatio(n1, n2);
      const centerX = (n1.x + n2.x) / 2;
      const centerY = (n1.y + n2.y) / 2;

      strings.push({
        n1,
        n2,
        centerX,
        centerY,
        freq,
        hzText: `${Math.round(freq)}`,
        verticalRatio,
        age: 0,
        lifetime: LIFETIME_SEC,
        pluckStrength: 28,
        vibPhase: 0,
        isInitial: false,
      });

      playBlendedTone(freq, verticalRatio);
    }

    function pointToSegmentDist(p, a, b) {
      const vx = b.x - a.x;
      const vy = b.y - a.y;
      const wx = p.x - a.x;
      const wy = p.y - a.y;
      const c1 = vx * wx + vy * wy;
      if (c1 <= 0) return Math.hypot(p.x - a.x, p.y - a.y);
      const c2 = vx * vx + vy * vy;
      if (c2 <= c1) return Math.hypot(p.x - b.x, p.y - b.y);
      const t = c1 / c2;
      return Math.hypot(p.x - (a.x + t * vx), p.y - (a.y + t * vy));
    }

    canvas.addEventListener("click", (evt) => {
      const { width } = getLogicalSize();
      const pt = { x: evt.clientX, y: evt.clientY };

      // クリックした場所に必ず丸い印（⚪︎）を表示
      const currentMarker = addCircleMarker(pt.x, pt.y);

      if (!hasPluckedInitialString) {
        hasPluckedInitialString = true;
        const initial = strings.find((s) => s.isInitial);
        if (initial) {
          initial.age = 0;
          initial.n1.age = 0;
          initial.n2.age = 0;
          initial.pluckStrength = 28;
          playBlendedTone(initial.freq, initial.verticalRatio);
          return;
        }
      }

      if (!anchorNode) {
        const hit = strings.find((s) => pointToSegmentDist(pt, s.n1, s.n2) < 12);
        if (hit) {
          hit.age = 0;
          hit.n1.age = 0;
          hit.n2.age = 0;
          hit.pluckStrength = 28;
          playBlendedTone(hit.freq, hit.verticalRatio);
          return;
        }
        // 1回目のクリック：始点の⚪︎をセット
        anchorNode = currentMarker;
        return;
      }

      // 2回目以降のクリック：直前の⚪︎と今回の⚪︎を結んで弦を張る
      createAndPluckString(anchorNode, currentMarker, width);

      // 3回目クリックは今回の⚪︎から続いて弦を結べるように連続性を維持
      anchorNode = currentMarker;
    });

    // FFT領域の境目がわかる描画
    function drawLogFFT(width, height, alpha) {
      if (alpha <= 0.01) return;

      const baseY = height * 0.82;
      const maxBarHeight = height * 0.34;
      const bandTop = baseY - maxBarHeight - 16;
      const bandBottom = height;

      ctx.save();
      ctx.globalAlpha = alpha;

      const bgGrad = ctx.createLinearGradient(0, bandTop, 0, bandBottom);
      bgGrad.addColorStop(0, "rgba(15, 23, 42, 0.0)");
      bgGrad.addColorStop(0.18, "rgba(15, 23, 42, 0.85)");
      bgGrad.addColorStop(1, "rgba(9, 13, 24, 0.95)");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, bandTop, width, bandBottom - bandTop);

      ctx.strokeStyle = "rgba(56, 189, 248, 0.55)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, baseY);
      ctx.lineTo(width, baseY);
      ctx.stroke();

      if (analyser && freqData && audioCtx) {
        analyser.getByteFrequencyData(freqData);
        const nyquist = audioCtx.sampleRate / 2;
        const binHz = nyquist / freqData.length;

        const points = [];
        for (let x = 0; x <= width; x += 2) {
          const freq = xToFreq(x, width);
          const bin = Math.min(freqData.length - 1, Math.max(0, Math.round(freq / binHz)));
          const norm = freqData[bin] / 255;
          const y = baseY - norm * maxBarHeight;
          points.push({ x, y });
        }

        if (points.length > 1) {
          const fillGrad = ctx.createLinearGradient(0, baseY - maxBarHeight, 0, baseY);
          fillGrad.addColorStop(0, "rgba(56, 189, 248, 0.42)");
          fillGrad.addColorStop(1, "rgba(37, 99, 235, 0.05)");

          ctx.fillStyle = fillGrad;
          ctx.beginPath();
          ctx.moveTo(points[0].x, baseY);
          for (const pt of points) {
            ctx.lineTo(pt.x, pt.y);
          }
          ctx.lineTo(points[points.length - 1].x, baseY);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "#7dd3fc";
          ctx.lineWidth = 2;
          ctx.beginPath();
          points.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // クリックした丸い印（⚪︎）の描画
    function drawCircleMarkers(dt) {
      for (let i = clickMarkers.length - 1; i >= 0; i--) {
        const m = clickMarkers[i];
        m.age += dt;
        m.pulseAge += dt;

        const lifeRatio = Math.max(0, 1 - m.age / m.lifetime);
        if (lifeRatio <= 0) {
          if (anchorNode === m) anchorNode = null;
          clickMarkers.splice(i, 1);
          continue;
        }

        const isActiveAnchor = anchorNode === m;
        const alpha = isActiveAnchor
          ? Math.max(0.55, lifeRatio)
          : Math.pow(lifeRatio, 1.15);

        ctx.save();
        ctx.globalAlpha = alpha;

        // ⚪︎（中抜きリング）
        const radius = isActiveAnchor ? 7 : 6;
        ctx.strokeStyle = isActiveAnchor ? "#7dd3fc" : "#ffffff";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(m.x, m.y, radius, 0, Math.PI * 2);
        ctx.stroke();

        // クリック直後に広がる淡い波紋リング
        if (m.pulseAge < 0.7) {
          const pRatio = m.pulseAge / 0.7;
          const pulseRadius = radius + pRatio * 14;
          ctx.globalAlpha = alpha * (1 - pRatio) * 0.7;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(m.x, m.y, pulseRadius, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // ⚪︎と⚪︎のあいだに張られた弦と中心の周波数数字を描画
    function drawStringsAndCenterNumbers(dt) {
      for (let i = strings.length - 1; i >= 0; i--) {
        const s = strings[i];
        s.age += dt;

        const lifeRatio = Math.max(0, 1 - s.age / s.lifetime);
        if (lifeRatio <= 0) {
          strings.splice(i, 1);
          continue;
        }

        const vibSpeed = 28 + Math.min(45, s.freq * 0.02);
        s.vibPhase += vibSpeed * dt;

        const pluckDecay = Math.exp(-s.age * 1.4);
        const currentAmp = s.pluckStrength * pluckDecay * lifeRatio;

        const dx = s.n2.x - s.n1.x;
        const dy = s.n2.y - s.n1.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        const nx = -dy / len;
        const ny = dx / len;

        const fadeAlpha = s.isInitial && !hasPluckedInitialString
          ? Math.max(0.35, lifeRatio)
          : Math.pow(lifeRatio, 1.15);

        const segments = 48;

        ctx.save();
        ctx.globalAlpha = fadeAlpha;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();

        for (let k = 0; k <= segments; k++) {
          const t = k / segments;
          const baseX = s.n1.x + dx * t;
          const baseY = s.n1.y + dy * t;

          const boundaryEnvelope = Math.sin(Math.PI * t);
          const wave =
            0.78 * Math.sin(Math.PI * t) * Math.sin(s.vibPhase) +
            0.22 * Math.sin(2 * Math.PI * t) * Math.sin(s.vibPhase * 1.9 + 0.7);

          const disp = wave * currentAmp * boundaryEnvelope;
          const px = baseX + nx * disp;
          const py = baseY + ny * disp;

          if (k === 0) {
            ctx.moveTo(px, py);
          } else {
            ctx.lineTo(px, py);
          }
        }

        ctx.stroke();
        ctx.restore();

        const cx = (s.n1.x + s.n2.x) / 2;
        const cy = (s.n1.y + s.n2.y) / 2;
        const riseOffset = (1 - lifeRatio) * 18;

        ctx.save();
        ctx.globalAlpha = fadeAlpha;
        ctx.fillStyle = "#ffffff";
        ctx.font = "300 24px system-ui, -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(s.hzText, cx, cy - riseOffset);
        ctx.restore();
      }
    }

    function loop(now) {
      const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
      lastTime = now;

      const { width, height } = getLogicalSize();
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      drawStringsAndCenterNumbers(dt);
      drawCircleMarkers(dt);
      drawLogFFT(width, height, fftAlpha);

      fftAlpha = Math.max(0, fftAlpha - dt * 0.45);

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
